[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Remediation item 11 — security headers a <meta http-equiv> tag cannot deliver.
# frame-ancestors is IGNORED inside meta CSP, so without a real HTTP header the
# admin, staff and booking-management pages can be framed and clickjacked.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://lovable.dev https://*.lovable.dev"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(self \"https://js.stripe.com\")"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
